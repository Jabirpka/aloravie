# Back office — admin.<domain> -> Next.js admin on :3001
#
# 1. Replace aloravie.com with your real domain.
# 2. sudo ln -s /etc/nginx/sites-available/admin.aloravie.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d admin.aloravie.com
server {
    listen 80;
    listen [::]:80;
    server_name admin.aloravie.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
