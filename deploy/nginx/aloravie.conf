# Storefront — apex + www -> Next.js storefront on :3000
#
# 1. Replace aloravie.com with your real domain throughout this file.
# 2. Symlink into sites-enabled and reload:
#      sudo ln -s /etc/nginx/sites-available/aloravie.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
# 3. Add HTTPS (edits this file in place to add the :443 block + cert paths):
#      sudo certbot --nginx -d aloravie.com -d www.aloravie.com
server {
    listen 80;
    listen [::]:80;
    server_name aloravie.com www.aloravie.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
