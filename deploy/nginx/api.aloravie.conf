# API — api.<domain> -> Node/Express backend on :4000
#
# 1. Replace aloravie.com with your real domain.
# 2. sudo ln -s /etc/nginx/sites-available/api.aloravie.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d api.aloravie.com
#
# NOTE: this host must be listed in the backend's CORS_ORIGINS, and baked into
# web/ and admin/ as NEXT_PUBLIC_API_URL at build time.
server {
    listen 80;
    listen [::]:80;
    server_name api.aloravie.com;

    # Product images / return photos / voice notes are uploaded through the API.
    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
