# IP-first / staging profile — no domain, no HTTPS.
# Use this to preview the system on the VPS IP (demo to a partner, test end-to-end)
# BEFORE you have a domain. For the real public launch, switch to the per-domain
# server blocks (aloravie.conf / admin.aloravie.conf / api.aloravie.conf) + certbot.
#
# `server_name _` is the catch-all default server, so it matches the bare IP —
# no domain or IP needs to be written here. Enable with:
#   sudo cp deploy/nginx/ip-staging.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/ip-staging.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo ufw allow 80 && sudo ufw allow 8081
#
# Reachable at:  storefront http://<IP>/   ·   admin http://<IP>:8081/   ·   API http://<IP>/api
# Build web + admin with:  NEXT_PUBLIC_API_URL=http://<IP>
# Backend .env:  CORS_ORIGINS=http://<IP>,http://<IP>:8081  (see deploy/README.md)

# Storefront (+ API on the same origin under /api)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 15M; # image / voice uploads
    }

    # Uploaded files (product photos, return photos) served by the API in local
    # storage mode. Without this they'd fall through to the storefront and 404.
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin back office on a separate port
server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
